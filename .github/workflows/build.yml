# Build & publish Docker images to GitHub Container Registry.
#
# Flow — two channels, gated by trigger:
#   • Push to main (dev/bleeding-edge) → publishes:
#        :latest         ← newest build, not vetted
#        :sha-<7chars>   ← traceable to a specific commit, for rollback
#   • Manual "Run workflow" (workflow_dispatch = a deliberate RELEASE) → publishes:
#        :stable         ← the vetted channel customers pull
#        :YYYY.MM.DD     ← the concrete dated version (annual-update pinning)
#        :sha-<7chars>
#
# Annual-update enforcement: launchtic.com/api/install/authorize hands each
# license the dated tag it's entitled to (frozen once its update window ends),
# and the VPS .env pins LAUNCHTIC_VERSION to it. So a RELEASE here must be paired
# with bumping LAUNCHTIC_CURRENT_VERSION on launchtic.com to the SAME date tag.
#
# Image visibility: KEEP THESE PACKAGES PRIVATE. The license gate works by
# vending GHCR pull tokens from /api/install/authorize — making the packages
# Public would let anyone pull them and defeat the gate.

name: Build & Push

on:
  push:
    branches: [main]
    # Skip rebuild when changes are docs/config-only — saves ~6 min of CI
    # wall-clock per cosmetic commit. Anything NOT listed here triggers a
    # build; the include-by-default behaviour is intentional so that adding
    # new code dirs (apps/X, packages/Y) doesn't silently skip them.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.dockerignore'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - 'docs/**'
      - 'scripts_test/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. 2026.07.01 (set the SAME value as LAUNCHTIC_CURRENT_VERSION on launchtic.com). Leave blank to use today (UTC).'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io under the org

    # 3 services build in parallel — different Dockerfiles, no shared deps to
    # cache between them. fail-fast off so one broken service doesn't cancel
    # the other two (you'd rather have 2/3 published than 0/3 while debugging).
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: web,      dockerfile: apps/web/Dockerfile }
          - { name: renderer, dockerfile: apps/renderer/Dockerfile }
          - { name: worker,   dockerfile: apps/worker/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action auto-lowercases the repo owner (ghcr.io path is
      # case-sensitive) and generates the two tags we want. Avoids the
      # `${VAR,,}` bash dance.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/launchtic-${{ matrix.service.name }}
          # Dev tags on push; release tags (stable + dated) only on a deliberate
          # workflow_dispatch. The dated tag is the input `version` if given,
          # else today's UTC date. sha tag always, for rollback traceability.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=stable,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
            type=raw,value={{date 'YYYY.MM.DD'}},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version == '' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only for now — covers 95% of VPS. Add linux/arm64
          # when an Oracle Free / Hetzner ARM user asks (build time ~2x).
          platforms: linux/amd64
          # Per-service GHA cache scope — each Dockerfile has its own layer
          # graph, sharing a single scope would just cause cache misses.
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,scope=${{ matrix.service.name }},mode=max
