# Build & publish Docker images to GitHub Container Registry.
#
# Flow — two channels, gated by trigger:
#   • Push to main (dev/bleeding-edge) → publishes:
#        :latest         ← newest build, not vetted
#        :sha-<7chars>   ← traceable to a specific commit, for rollback
#   • Manual "Run workflow" (workflow_dispatch = a deliberate RELEASE) → publishes:
#        :stable         ← the vetted channel customers pull
#        :YYYY.MM.DD     ← the concrete dated version (annual-update pinning)
#        :sha-<7chars>
#
# Updates are free for every self-hosted instance, Free or Agency — no
# license/entitlement gate on versions. A RELEASE here must be paired with
# bumping LAUNCHTIC_CURRENT_VERSION on launchtic.com to the SAME date tag, so
# /api/version (public, unauthenticated) advertises it to install.sh/update.sh.
#
# Image visibility: these packages MUST be Public on GHCR. install.sh/update.sh
# pull with no `docker login` — Free self-hosting never talks to launchtic.com
# beyond the version check. Set visibility once per package (Package settings →
# Change visibility) after the first push under the new org.

name: Build & Push

on:
  push:
    branches: [main]
    # Skip rebuild when changes are docs/config-only — saves ~6 min of CI
    # wall-clock per cosmetic commit. Anything NOT listed here triggers a
    # build; the include-by-default behaviour is intentional so that adding
    # new code dirs (apps/X, packages/Y) doesn't silently skip them.
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.dockerignore'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/dependabot.yml'
      - 'docs/**'
      - 'scripts_test/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. 2026.07.01 (also set LAUNCHTIC_CURRENT_VERSION on launchtic.com to match). Leave blank for today (UTC) — a 2nd release the same day auto-becomes -2, -3, …'
        required: false
        type: string

jobs:
  # Resolve the dated release tag ONCE so all matrix services share the same
  # value. On a manual release: use the typed version; else today's UTC date —
  # and if that date tag already exists in GHCR (a 2nd release the same day),
  # auto-append -2, -3, … so you never type the suffix by hand.
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT" ]; then
            echo "version=$INPUT" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="$(date -u +%Y.%m.%d)"
          # launchtic-web's existing tags stand in for the whole release set
          # (all 3 images are tagged together each release).
          TAGS="$(gh api --paginate \
            "/orgs/${OWNER}/packages/container/launchtic-web/versions" \
            --jq '.[].metadata.container.tags[]' 2>/dev/null || true)"
          version="$BASE"
          if echo "$TAGS" | grep -qx "$BASE"; then
            n=2
            while echo "$TAGS" | grep -qx "$BASE-$n"; do n=$((n+1)); done
            version="$BASE-$n"
          fi
          echo "Resolved release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io under the org

    # 3 services build in parallel — different Dockerfiles, no shared deps to
    # cache between them. fail-fast off so one broken service doesn't cancel
    # the other two (you'd rather have 2/3 published than 0/3 while debugging).
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: web,      dockerfile: apps/web/Dockerfile }
          - { name: renderer, dockerfile: apps/renderer/Dockerfile }
          - { name: worker,   dockerfile: apps/worker/Dockerfile }

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action auto-lowercases the repo owner (ghcr.io path is
      # case-sensitive) and generates the two tags we want. Avoids the
      # `${VAR,,}` bash dance.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/launchtic-${{ matrix.service.name }}
          # Dev tags on push; release tags (stable + dated) only on a deliberate
          # workflow_dispatch. The dated tag comes pre-resolved (with auto -N
          # suffix) from the resolve-version job. sha tag always, for rollback.
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=stable,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ needs.resolve-version.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only for now — covers 95% of VPS. Add linux/arm64
          # when an Oracle Free / Hetzner ARM user asks (build time ~2x).
          platforms: linux/amd64
          # Per-service GHA cache scope — each Dockerfile has its own layer
          # graph, sharing a single scope would just cause cache misses.
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,scope=${{ matrix.service.name }},mode=max

  # Manual releases only, after all 3 images are published: tag the commit and
  # create a GitHub Release whose notes list the commits since the last release
  # (chore:/docs:/ci: commits left out).
  release:
    needs: [resolve-version, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags, to find the previous release

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          # Previous dated release tag (ignores other tags like pre-revert-*).
          PREV="$(git describe --tags --abbrev=0 --match '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*' 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}HEAD"
          {
            echo "## What's changed"
            echo
            git log --no-merges --format='- %s' "$RANGE" \
              | grep -viE '^- (chore|docs|ci|style|test)(\(.*\))?:' \
              | head -n 100 || true
            echo
            echo "Update: \`cd launchtic && curl -fsSL https://launchtic.com/update | bash\`"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full diff:** https://github.com/${{ github.repository }}/compare/$PREV...$VERSION"
            fi
          } > notes.md
          cat notes.md
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
