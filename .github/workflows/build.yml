# Build & publish Docker images to GitHub Container Registry.
#
# Flow:
#   1. Push to main → this workflow runs
#   2. Builds all 3 service images in parallel (web / renderer / worker)
#   3. Publishes each to ghcr.io with two tags:
#        :latest         ← user self-host pulls this by default
#        :sha-<7chars>   ← traceable to specific commit, for rollback
#   4. User self-host then runs: `docker compose pull && docker compose up -d`
#
# First-time setup (one-off, after the first successful run):
#   The 3 images appear at https://github.com/TechFago/launchtic?tab=packages
#   as PRIVATE by default. Make each one Public:
#     Package page → ⚙ Package settings → Change visibility → Public
#   Subsequent runs require no manual action — visibility persists.
#
# Manual trigger: GitHub Actions UI has a "Run workflow" button (workflow_dispatch).
# Useful for republishing after fixing a broken release without making a new commit.

name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io under the org

    # 3 services build in parallel — different Dockerfiles, no shared deps to
    # cache between them. fail-fast off so one broken service doesn't cancel
    # the other two (you'd rather have 2/3 published than 0/3 while debugging).
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: web,      dockerfile: apps/web/Dockerfile }
          - { name: renderer, dockerfile: apps/renderer/Dockerfile }
          - { name: worker,   dockerfile: apps/worker/Dockerfile }

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action auto-lowercases the repo owner (ghcr.io path is
      # case-sensitive) and generates the two tags we want. Avoids the
      # `${VAR,,}` bash dance.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/launchtic-${{ matrix.service.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only for now — covers 95% of VPS. Add linux/arm64
          # when an Oracle Free / Hetzner ARM user asks (build time ~2x).
          platforms: linux/amd64
          # Per-service GHA cache scope — each Dockerfile has its own layer
          # graph, sharing a single scope would just cause cache misses.
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to:   type=gha,scope=${{ matrix.service.name }},mode=max
