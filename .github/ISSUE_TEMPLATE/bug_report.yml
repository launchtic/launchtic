name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launchtic version
      description: Settings → License & Updates (e.g. 2026.10.23)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - One-line installer (Docker)
        - Local development
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Output of `docker compose logs --tail=100 web` (remove any secrets)"
      render: shell
