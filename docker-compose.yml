services:
  # ─── Apps ──────────────────────────────────────────────
  web:
    image: ghcr.io/techfago/launchtic-web:${LAUNCHTIC_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    volumes:
      # Persist user uploads outside the container so they survive rebuilds.
      - ./uploads:/app/apps/web/public/uploads
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/launchtic
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # The image tag this stack runs — shown in Settings → License + compared
      # against launchtic.com/api/version to surface "update available".
      LAUNCHTIC_VERSION: ${LAUNCHTIC_VERSION:-stable}
      # Public demo (demo.launchtic.com only — leave default for real installs):
      # auto-login as the demo user + block risky actions + suppress email.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@launchtic.com}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-launchtic-demo}
      # APP_DOMAIN, PAGES_DOMAIN, APP_URL, RENDERER_URL are no longer required
      # at boot — the first-run wizard writes them to the SystemConfig table
      # and apps read from DB via lib/system-config.ts. NextAuth uses
      # trustHost:true so it derives its URL from the X-Forwarded-Host header.
      # The Caddy admin API hostname is reachable from web for wizard reload.
      CADDY_ADMIN_URL: http://caddy:2019
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  renderer:
    image: ghcr.io/techfago/launchtic-renderer:${LAUNCHTIC_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/launchtic
      REDIS_URL: redis://redis:6379
      WEB_API_URL: http://web:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/techfago/launchtic-worker:${LAUNCHTIC_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/launchtic
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Demo: suppress outbound email at the send chokepoint.
      DEMO_MODE: ${DEMO_MODE:-false}
      # Worker reads APP_URL / RENDERER_URL from SystemConfig at runtime via
      # lib/system-config.ts (60s cache). Env vars no longer required.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Reverse Proxy + SSL ────────────────────────────────
  caddy:
    image: caddy:2-alpine
    # --resume restores the last config persisted by Caddy's autosave
    # (written to /config/caddy/autosave.json after every admin API reload).
    # First boot: no autosave exists → falls back to Caddyfile (wizard mode).
    # Post-wizard restart: loads autosave → instant HTTPS without re-running
    # the wizard. Without --resume the container would revert to wizard mode
    # on every restart and trap the user in an infinite redirect.
    command: caddy run --resume --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"    # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # SSL certs persisted across restarts
      - caddy_config:/config   # admin-API-written runtime config persists here
      - ./uploads:/srv/uploads:ro
    # No ACME_EMAIL / APP_DOMAIN env — initial Caddyfile is HTTP-only and the
    # wizard injects the post-setup config (with email + domains) via the
    # admin API. Port 2019 is exposed only on the internal docker network.
    expose:
      - "2019"
    depends_on:
      - web
      - renderer
    restart: unless-stopped

  # ─── Infrastructure ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: launchtic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:      # SSL certs
  caddy_config:    # runtime config from admin API
